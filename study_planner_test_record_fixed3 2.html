
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Planner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #527da8;
  --blue-dark: #315779;
  --blue-light: #eaf2f9;
  --blue-pale: #f5f9fd;
  --line: #d5e2ee;
  --text: #34485a;
  --muted: #8194a6;
  --white: #fff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f2f6fa;
  color: var(--text);
  font-family: "Yusei Magic", sans-serif;
  font-size: 14px;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid #6c9ac5;
  outline-offset: 2px;
}

.app {
  max-width: 1500px;
  margin: 0 auto;
  padding: 18px;
}

/* 上部はページ切り替えボタンだけ */
.topbar {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

.nav-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.backup-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.tab-button, .small-button {
  border: 1px solid var(--line);
  background: white;
  border-radius: 10px;
  padding: 9px 14px;
  color: var(--blue-dark);
}

.tab-button.active {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}

.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 3px 12px #304f6810;
  min-width: 0;
}

.panel-title {
  margin: 0 0 14px;
  color: var(--blue-dark);
  font-size: 18px;
}

.subheading {
  margin: 18px 0 10px;
  color: var(--blue-dark);
  font-size: 15px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}

.toolbar select, .toolbar input,
.form-input, .form-select {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
  background: white;
  max-width: 100%;
}

.month-heading {
  display: flex;
  align-items: center;
  gap: 10px;
}

.month-heading button {
  background: var(--blue-light);
  color: var(--blue-dark);
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
}

.month-heading strong {
  font-size: 21px;
  min-width: 110px;
  text-align: center;
}

.month-layout {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(230px, 1fr);
  gap: 18px;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}

.calendar-head, .calendar-cell {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}

.calendar-head {
  background: var(--blue-light);
  color: var(--blue-dark);
  text-align: center;
  padding: 9px 2px;
}

.calendar-head:first-child { color: #c66c75; }
.calendar-head:last-child { color: #628dbd; }

.calendar-cell {
  min-height: 105px;
  padding: 5px;
  background: white;
}

.calendar-cell.outside {
  background: #f7f9fb;
  color: #b5c0ca;
}

.calendar-cell.today {
  background: #f0f7ff;
}

.day-number {
  font-size: 12px;
  margin-bottom: 4px;
}

.calendar-cell textarea {
  width: 100%;
  min-height: 65px;
  border: 0;
  outline: none;
  resize: vertical;
  background: transparent;
  font-size: 12px;
  line-height: 1.5;
}

.calendar-cell textarea:focus {
  background: #f7fbff;
}

.section-label {
  display: block;
  margin-bottom: 8px;
  color: var(--blue-dark);
}

.paper-textarea {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: none;
  line-height: 2;
  background-color: white;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 30px,
    #dce8f2 31px
  );
  background-attachment: local;
}

.paper-textarea:focus {
  border-color: #91b2d1;
}

.month-memo {
  margin-top: 16px;
}

.month-memo .paper-textarea {
  min-height: 115px;
}

.week-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 15px;
}

.week-toolbar strong {
  color: var(--blue-dark);
  font-size: 19px;
}

.week-toolbar button {
  background: var(--blue-light);
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--blue-dark);
}

.habit-settings {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: var(--blue-pale);
  margin-bottom: 14px;
}

.habit-settings-title {
  margin: 0 0 10px;
  color: var(--blue-dark);
}

.habit-inputs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.habit-inputs input {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px;
  background: white;
}

.week-layout {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(230px, 1fr);
  gap: 18px;
  align-items: start;
}

.week-schedule {
  min-width: 0;
}

.week-grid-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  min-width: 700px;
}

.week-day {
  min-width: 0;
  border-right: 1px solid var(--line);
  background: white;
}

.week-day:last-child {
  border-right: 0;
}

.week-day-title {
  background: var(--blue-light);
  color: var(--blue-dark);
  text-align: center;
  padding: 10px 3px;
  border-bottom: 1px solid var(--line);
}

.week-day-title small {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  font-weight: normal;
}

.week-day-content {
  padding: 7px;
}

.day-task {
  width: 100%;
  min-height: 70px;
  resize: vertical;
  border: 1px solid #e0e8ef;
  border-radius: 6px;
  padding: 5px;
  font-size: 12px;
  line-height: 1.5;
}

.habit-list {
  margin: 10px 0;
  padding: 8px 4px;
  border-top: 1px dashed var(--line);
  border-bottom: 1px dashed var(--line);
}

.habit-item {
  display: flex;
  gap: 5px;
  align-items: flex-start;
  margin: 7px 0;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.habit-item input {
  margin: 2px 0 0;
  accent-color: var(--blue);
  flex-shrink: 0;
}

.habit-item span {
  line-height: 1.4;
}

.study-label {
  font-size: 11px;
  color: var(--muted);
  display: block;
  margin: 8px 0 4px;
}

.study-input {
  width: 100%;
  min-width: 0;
  border: 1px solid #e0e8ef;
  border-radius: 6px;
  padding: 6px 4px;
  font-size: 12px;
}

.time-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 12px;
}

.time-table th, .time-table td {
  border: 1px solid var(--line);
  padding: 5px;
}

.time-table th {
  background: var(--blue-light);
  font-weight: normal;
}

.time-table input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  padding: 4px;
  background: transparent;
}

.week-plan-panel {
  min-width: 0;
}

.week-plan-panel .paper-textarea {
  min-height: 380px;
}

.week-summary {
  margin-top: 16px;
}

.week-summary .paper-textarea {
  min-height: 100px;
}

.records-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 18px;
}

.record-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  min-width: 0;
}

.record-form > div {
  min-width: 0;
  width: 100%;
}

/* 入力欄がパネルからはみ出さないよう、グリッドと入力欄の幅を制限 */
.record-form {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  width: 100%;
}

.record-form > .record-wide-field {
  grid-column: 1 / -1;
  width: 100%;
  min-width: 0;
}

.record-form input[type="date"],
.record-form input[type="number"],
.record-form input[type="text"] {
  display: block;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  max-width: 100%;
}

/* Safariの日付入力も他の入力欄と同じ幅に固定 */
.record-form .record-wide-field input[type="date"] {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
  padding-left: 6px;
  padding-right: 6px;
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.record-form label {
  display: block;
  color: var(--blue-dark);
  font-size: 12px;
  margin-bottom: 5px;
}

.record-form input, .record-form select, .record-form textarea {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 10px;
  background: white;
}

.record-form input[type="date"] {
  box-sizing: border-box;
  min-height: 42px;
}

.record-form textarea {
  line-height: 1.7;
}

.record-form .full {
  grid-column: 1 / -1;
}

.primary-button {
  background: var(--blue);
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
}

.records-list {
  display: grid;
  gap: 10px;
}

.record-item {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: var(--blue-pale);
}

.record-item-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.record-item strong {
  color: var(--blue-dark);
}

.record-item p {
  margin: 7px 0 0;
  overflow-wrap: anywhere;
}

.delete-button {
  border: 1px solid #e4c8cb;
  background: white;
  color: #a65d66;
  border-radius: 7px;
  padding: 5px 8px;
}

.memo-page {
  max-width: 1000px;
  margin: 0 auto;
}

.memo-page .paper-textarea {
  min-height: 500px;
}

.empty-message {
  color: var(--muted);
  padding: 20px 0;
  text-align: center;
}

.footer-note {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

.hidden {
  display: none !important;
}

@media (max-width: 1000px) {
  .month-layout, .week-layout, .records-layout {
    grid-template-columns: 1fr;
  }

  .week-grid {
    min-width: 770px;
  }

  .week-plan-panel .paper-textarea {
    min-height: 230px;
  }
}

@media (max-width: 600px) {
  .app {
    padding: 10px;
  }

  .panel {
    padding: 12px;
  }

  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: 100%;
  }

  .backup-controls {
    width: 100%;
  }

  .backup-controls button {
    flex: 1;
  }

  .tab-button {
    padding: 9px 5px;
  }

  .calendar-cell {
    min-height: 76px;
    padding: 3px;
  }

  .calendar-cell textarea {
    min-height: 44px;
    font-size: 10px;
  }

  .habit-inputs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .record-form {
    grid-template-columns: 1fr;
  }

  .record-form .full {
    grid-column: auto;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <nav class="nav-tabs" aria-label="ページ切り替え">
      <button class="tab-button active" data-page="month">月間ページ</button>
      <button class="tab-button" data-page="week">週間ページ</button>
      <button class="tab-button" data-page="records">テスト記録</button>
      <button class="tab-button" data-page="memo">メモ帳</button>
    </nav>
    <div class="backup-controls" aria-label="保存と復元">
      <button type="button" id="exportBackup" class="small-button">データを保存</button>
      <button type="button" id="importBackupButton" class="small-button">データを復元</button>
      <input type="file" id="importBackupFile" accept=".json,application/json" hidden>
    </div>
  </div>

  <main>
    <section id="monthPage" class="page">
      <div class="panel">
        <div class="toolbar">
          <div class="month-heading">
            <button id="prevMonth" aria-label="前の月">←</button>
            <strong id="monthTitle"></strong>
            <button id="nextMonth" aria-label="次の月">→</button>
          </div>
          <label>
            <span class="section-label">月を選択</span>
            <select id="monthSelect"></select>
          </label>
        </div>

        <div class="month-layout">
          <div>
            <div id="calendar" class="calendar"></div>
            <div class="month-memo">
              <label class="section-label" for="monthMemo">今月の目標・振り返り</label>
              <textarea id="monthMemo" class="paper-textarea"
                placeholder="今月の目標や、振り返りを書こう！"></textarea>
            </div>
          </div>

          <aside class="panel">
            <h3 class="panel-title">今月の予定・メモ</h3>
            <label class="section-label" for="monthPlan">今月やること・大切な予定</label>
            <textarea id="monthPlan" class="paper-textarea"
              placeholder="今月の予定や、忘れたくないことを書こう！"></textarea>
          </aside>
        </div>
      </div>
    </section>

    <section id="weekPage" class="page hidden">
      <div class="panel">
        <div class="week-toolbar">
          <div>
            <strong id="weekTitle"></strong>
            <div style="font-size:12px;color:var(--muted);margin-top:5px">
              週ごとの予定と習慣を記録しよう
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="prevWeek">← 前の週</button>
            <button id="nextWeek">次の週 →</button>
          </div>
        </div>

        <div class="week-layout">
          <div class="week-schedule">
            <div class="habit-settings">
              <h3 class="habit-settings-title">習慣の設定</h3>
              <div class="habit-inputs">
                <input data-habit-name="0" aria-label="習慣1の名前" placeholder="習慣1">
                <input data-habit-name="1" aria-label="習慣2の名前" placeholder="習慣2">
                <input data-habit-name="2" aria-label="習慣3の名前" placeholder="習慣3">
                <input data-habit-name="3" aria-label="習慣4の名前" placeholder="習慣4">
              </div>
              <div style="font-size:11px;color:var(--muted);margin-top:7px">
                ここで変更すると、同じ月のすべての週に反映されます。
              </div>
            </div>

            <div class="week-grid-wrap">
              <div id="weekGrid" class="week-grid"></div>
            </div>

            <div class="week-summary">
              <label class="section-label" for="weekReflection">今週の振り返り</label>
              <textarea id="weekReflection" class="paper-textarea"
                placeholder="できたこと、次に改善したいことなど"></textarea>

              <label class="section-label" for="nextWeekGoal" style="margin-top:14px">
                来週の目標
              </label>
              <textarea id="nextWeekGoal" class="paper-textarea"
                placeholder="来週がんばりたいことを書こう！"></textarea>
            </div>
          </div>

          <aside class="panel week-plan-panel">
            <h3 class="panel-title">今週やること</h3>
            <label class="section-label" for="weekPlan">
              1週間の目標・やることリスト
            </label>
            <textarea id="weekPlan" class="paper-textarea"
              placeholder="・数学の問題集を進める&#10;・英単語を覚える&#10;・提出物を終わらせる&#10;&#10;今週やることをまとめよう！"></textarea>
          </aside>
        </div>
      </div>
    </section>

    <section id="recordsPage" class="page hidden">
      <div class="records-layout">
        <div class="panel">
          <h3 class="panel-title">テスト記録を追加</h3>
          <form id="recordForm" class="record-form">
            <div class="record-wide-field">
              <label for="testDate">日付</label>
              <input id="testDate" type="date" required>
            </div>
            <div class="record-wide-field">
              <label for="testName">テスト名</label>
              <input id="testName" placeholder="例：定期テスト" required>
            </div>
            <div>
              <label for="testSubject">科目</label>
              <input id="testSubject" placeholder="例：数学">
            </div>
            <div>
              <label for="testGoal">目標点</label>
              <input id="testGoal" type="number" min="0" placeholder="例：85">
            </div>
            <div>
              <label for="testTotal">満点</label>
              <input id="testTotal" type="number" min="1" placeholder="例：100">
            </div>
            <div>
              <label for="testScore">点数</label>
              <input id="testScore" type="number" min="0" placeholder="例：80">
            </div>
            <div class="full">
              <label for="testRange">テスト範囲</label>
              <textarea id="testRange" rows="5"
                placeholder="例：教科書 p.20〜45、ワーク p.10〜18
出題される単元やページを書こう！"
                style="min-height:150px;resize:vertical"></textarea>
            </div>
            <div class="full">
              <label for="testReflection">振り返り・次に向けて</label>
              <textarea id="testReflection" rows="4" style="min-height:110px;resize:vertical"
                placeholder="よかったところ、次に改善したいところ"></textarea>
            </div>
            <div class="full">
              <button class="primary-button" type="submit">記録を保存する</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <h3 class="panel-title">テストの記録</h3>
          <div id="recordsList" class="records-list"></div>
        </div>
      </div>
    </section>

    <section id="memoPage" class="page hidden">
      <div class="panel memo-page">
        <h3 class="panel-title">自由に使えるメモ帳</h3>
        <textarea id="freeMemo" class="paper-textarea"
          placeholder="勉強のアイデア、気づいたこと、忘れたくないことなどを自由に書こう！"></textarea>
      </div>
    </section>
  </main>

  <div class="footer-note">
    自分のペースで、少しずつ記録していこう。
  </div>
</div>

<script>
(() => {
  "use strict";

  const YEAR = 2027;
  const STORAGE_KEY = "planner_v5";
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  const DAYS = ["日", "月", "火", "水", "木", "金", "土"];
  const DEFAULT_HABITS = ["英単語", "数学", "復習", "早寝"];

  let currentMonth = 0;
  let currentWeekStart = null;
  let activePage = "month";

  function emptyMonth() {
    return {
      days: {},
      plan: "",
      memo: "",
      habitNames: [...DEFAULT_HABITS],
      weeks: {}
    };
  }

  function emptyWeek() {
    return {
      plan: "",
      reflection: "",
      nextGoal: "",
      days: {}
    };
  }

  function loadData() {
    try {
      const raw =
        localStorage.getItem(STORAGE_KEY) ||
        localStorage.getItem("planner_v4") ||
        localStorage.getItem("planner_v3");

      if (!raw) return { months: {}, records: [], freeMemo: "" };

      const saved = JSON.parse(raw);
      if (!saved.months) saved.months = {};
      if (!Array.isArray(saved.records)) saved.records = [];
      if (typeof saved.freeMemo !== "string") saved.freeMemo = "";
      return saved;
    } catch (error) {
      console.error("保存データを読み込めませんでした", error);
      return { months: {}, records: [], freeMemo: "" };
    }
  }

  const data = loadData();

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (error) {
      console.error("保存できませんでした", error);
      alert("自動保存に失敗しました。すぐに「データを保存」ボタンでバックアップしてください。");
      return false;
    }
  }

  // データをJSONファイルとして保存する
  function exportBackup() {
    try {
      const backup = {
        app: "MY STUDY PLANNER",
        formatVersion: 1,
        exportedAt: new Date().toISOString(),
        data: data
      };
      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const today = dateKey(new Date());

      link.href = url;
      link.download = "study-planner-backup-" + today + ".json";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
      alert("バックアップファイルを作成しました。ファイルアプリなどに保存してください。");
    } catch (error) {
      console.error("バックアップを作成できませんでした", error);
      alert("バックアップを作成できませんでした。もう一度お試しください。");
    }
  }

  // 復元用データの最低限の形式を確認する
  function isValidBackup(candidate) {
    return Boolean(
      candidate &&
      typeof candidate === "object" &&
      candidate.months &&
      typeof candidate.months === "object" &&
      !Array.isArray(candidate.months) &&
      Array.isArray(candidate.records) &&
      typeof candidate.freeMemo === "string"
    );
  }

  async function importBackup(file) {
    if (!file) return;

    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      // 新しい形式と、以前の形式のJSONデータの両方に対応
      const importedData = parsed && parsed.data ? parsed.data : parsed;

      if (!isValidBackup(importedData)) {
        alert("このファイルは手帳のバックアップとして読み取れませんでした。JSONファイルを確認してください。");
        return;
      }

      const confirmed = confirm(
        "バックアップを復元しますか？\\n\\n現在の手帳データは、選んだファイルの内容に置き換わります。\\n先に今のデータを保存しておくと安心です。"
      );
      if (!confirmed) return;

      // 保存容量エラー時に画面だけが置き換わらないよう、先に保存を試す
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(importedData));
      } catch (storageError) {
        console.error("復元データを保存できませんでした", storageError);
        alert("ブラウザの保存容量が足りず、復元できませんでした。現在のデータは置き換えていません。");
        return;
      }

      Object.keys(data).forEach(key => delete data[key]);
      Object.assign(data, importedData);

      currentMonth = 0;
      currentWeekStart = getWeekStart(new Date(YEAR, 0, 1));
      renderActivePage();
      alert("復元できました！手帳の内容を確認してください。");
    } catch (error) {
      console.error("バックアップを読み込めませんでした", error);
      alert("ファイルを読み込めませんでした。正しいバックアップファイルか確認してください。");
    }
  }

  function getMonth(monthIndex = currentMonth) {
    const key = String(monthIndex);
    if (!data.months[key]) data.months[key] = emptyMonth();

    const month = data.months[key];
    if (!month.days) month.days = {};
    if (!month.weeks) month.weeks = {};
    if (!Array.isArray(month.habitNames)) {
      month.habitNames = [...DEFAULT_HABITS];
    }

    while (month.habitNames.length < 4) {
      month.habitNames.push(DEFAULT_HABITS[month.habitNames.length]);
    }

    return month;
  }

  function dateKey(date) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }

  function parseDate(key) {
    const [year, month, day] = key.split("-").map(Number);
    return new Date(year, month - 1, day);
  }

  function getDayData(date) {
    const month = getMonth(date.getMonth());
    const key = String(date.getDate());

    if (!month.days[key]) month.days[key] = { note: "" };
    return month.days[key];
  }

  function getWeekStart(date) {
    const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const day = start.getDay();
    start.setDate(start.getDate() - ((day + 6) % 7));
    start.setHours(0, 0, 0, 0);
    return start;
  }

  function weekKey(date) {
    return dateKey(getWeekStart(date));
  }

  function getWeekData(startDate = currentWeekStart) {
    const key = weekKey(startDate);
    const month = getMonth(startDate.getMonth());

    if (!month.weeks[key]) month.weeks[key] = emptyWeek();

    const week = month.weeks[key];

    if (typeof week.plan !== "string") {
      week.plan = typeof week.memo === "string" ? week.memo : "";
    }
    if (typeof week.reflection !== "string") week.reflection = "";
    if (typeof week.nextGoal !== "string") week.nextGoal = "";
    if (!week.days) week.days = {};

    return week;
  }

  function getWeekDayData(date) {
    const week = getWeekData(getWeekStart(date));
    const key = dateKey(date);

    if (!week.days[key]) {
      week.days[key] = {
        task: "",
        habits: [false, false, false, false],
        study: "",
        screen: "",
        hours: {}
      };
    }

    const day = week.days[key];
    if (!Array.isArray(day.habits)) day.habits = [false, false, false, false];
    while (day.habits.length < 4) day.habits.push(false);
    if (!day.hours) day.hours = {};

    return day;
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function setPage(page) {
    activePage = page;

    $$(".tab-button").forEach(button => {
      button.classList.toggle("active", button.dataset.page === page);
    });

    $$(".page").forEach(section => section.classList.add("hidden"));
    const target = $("#" + page + "Page");
    if (target) target.classList.remove("hidden");

    renderActivePage();
  }

  function renderActivePage() {
    if (activePage === "month") renderMonth();
    if (activePage === "week") renderWeek();
    if (activePage === "records") renderRecords();
    if (activePage === "memo") $("#freeMemo").value = data.freeMemo || "";
  }

  function renderMonthSelect() {
    const select = $("#monthSelect");
    select.innerHTML = "";

    for (let i = 0; i < 12; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = (i + 1) + "月";
      select.appendChild(option);
    }

    select.value = String(currentMonth);
  }

  function renderMonth() {
    const month = getMonth();
    $("#monthTitle").textContent = YEAR + "年 " + (currentMonth + 1) + "月";
    renderMonthSelect();

    $("#monthPlan").value = month.plan || "";
    $("#monthMemo").value = month.memo || "";

    const calendar = $("#calendar");
    calendar.innerHTML = "";

    // 月曜始まり
    ["月", "火", "水", "木", "金", "土", "日"].forEach(day => {
      const head = document.createElement("div");
      head.className = "calendar-head";
      head.textContent = day;
      calendar.appendChild(head);
    });

    const firstDay = new Date(YEAR, currentMonth, 1);
    const mondayOffset = (firstDay.getDay() + 6) % 7;
    const gridStart = new Date(YEAR, currentMonth, 1 - mondayOffset);

    for (let i = 0; i < 42; i++) {
      const date = new Date(gridStart);
      date.setDate(gridStart.getDate() + i);

      const cell = document.createElement("div");
      cell.className = "calendar-cell";

      if (date.getMonth() !== currentMonth) cell.classList.add("outside");

      const today = new Date();
      if (dateKey(date) === dateKey(today)) cell.classList.add("today");

      const number = document.createElement("div");
      number.className = "day-number";
      number.textContent = date.getDate();
      cell.appendChild(number);

      const note = document.createElement("textarea");
      note.setAttribute("aria-label", dateKey(date) + "の予定");
      note.placeholder = "予定…";

      if (date.getFullYear() === YEAR) {
        note.value = getDayData(date).note || "";
        note.dataset.calendarDate = dateKey(date);
      } else {
        note.disabled = true;
      }

      cell.appendChild(note);
      calendar.appendChild(cell);
    }
  }

  function renderHabitSettings() {
    const names = getMonth(currentWeekStart.getMonth()).habitNames;

    $$("[data-habit-name]").forEach(input => {
      const index = Number(input.dataset.habitName);
      input.value = names[index] || "";
    });
  }

  function renderWeek() {
    if (!currentWeekStart) {
      currentWeekStart = getWeekStart(new Date(YEAR, currentMonth, 1));
    }

    currentMonth = currentWeekStart.getMonth();

    const week = getWeekData(currentWeekStart);
    const end = new Date(currentWeekStart);
    end.setDate(end.getDate() + 6);

    $("#weekTitle").textContent =
      currentWeekStart.getFullYear() + "年 " +
      (currentWeekStart.getMonth() + 1) + "月" +
      currentWeekStart.getDate() + "日 ～ " +
      (end.getMonth() + 1) + "月" + end.getDate() + "日";

    renderHabitSettings();

    $("#weekPlan").value = week.plan || "";
    $("#weekReflection").value = week.reflection || "";
    $("#nextWeekGoal").value = week.nextGoal || "";

    const grid = $("#weekGrid");
    grid.innerHTML = "";

    for (let i = 0; i < 7; i++) {
      const date = new Date(currentWeekStart);
      date.setDate(date.getDate() + i);

      const dayData = getWeekDayData(date);
      const col = document.createElement("div");
      col.className = "week-day";

      const title = document.createElement("div");
      title.className = "week-day-title";
      title.innerHTML =
        escapeHTML(DAYS[date.getDay()]) +
        "<small>" + (date.getMonth() + 1) + "/" + date.getDate() + "</small>";
      col.appendChild(title);

      const content = document.createElement("div");
      content.className = "week-day-content";

      const task = document.createElement("textarea");
      task.className = "day-task";
      task.placeholder = "今日の予定";
      task.value = dayData.task || "";
      task.dataset.weekField = "task";
      task.dataset.date = dateKey(date);
      content.appendChild(task);

      const habitList = document.createElement("div");
      habitList.className = "habit-list";
      const names = getMonth(date.getMonth()).habitNames;

      for (let h = 0; h < 4; h++) {
        const label = document.createElement("label");
        label.className = "habit-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(dayData.habits[h]);
        checkbox.dataset.habitCheck = String(h);
        checkbox.dataset.date = dateKey(date);

        const span = document.createElement("span");
        span.textContent = names[h] || ("習慣" + (h + 1));

        label.appendChild(checkbox);
        label.appendChild(span);
        habitList.appendChild(label);
      }

      content.appendChild(habitList);

      const studyLabel = document.createElement("label");
      studyLabel.className = "study-label";
      studyLabel.textContent = "勉強時間";

      const studyInput = document.createElement("input");
      studyInput.className = "study-input";
      studyInput.placeholder = "例：2時間";
      studyInput.value = dayData.study || "";
      studyInput.dataset.weekField = "study";
      studyInput.dataset.date = dateKey(date);

      content.appendChild(studyLabel);
      content.appendChild(studyInput);

      const screenLabel = document.createElement("label");
      screenLabel.className = "study-label";
      screenLabel.textContent = "スマホ時間";

      const screenInput = document.createElement("input");
      screenInput.className = "study-input";
      screenInput.placeholder = "例：1時間";
      screenInput.value = dayData.screen || "";
      screenInput.dataset.weekField = "screen";
      screenInput.dataset.date = dateKey(date);

      content.appendChild(screenLabel);
      content.appendChild(screenInput);

      col.appendChild(content);
      grid.appendChild(col);
    }

    renderTimeTable();
    saveData();
  }

  function renderTimeTable() {
    const existing = $("#timeTablePanel");
    if (existing) existing.remove();

    const panel = document.createElement("div");
    panel.id = "timeTablePanel";
    panel.style.marginTop = "18px";

    const heading = document.createElement("h3");
    heading.className = "subheading";
    heading.textContent = "時間ごとの予定";
    panel.appendChild(heading);

    const wrap = document.createElement("div");
    wrap.style.overflowX = "auto";

    const table = document.createElement("table");
    table.className = "time-table";

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    const timeHead = document.createElement("th");
    timeHead.textContent = "時間";
    headRow.appendChild(timeHead);

    for (let i = 0; i < 7; i++) {
      const date = new Date(currentWeekStart);
      date.setDate(date.getDate() + i);

      const th = document.createElement("th");
      th.textContent = DAYS[date.getDay()];
      headRow.appendChild(th);
    }

    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    for (let hour = 4; hour <= 24; hour++) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = hour === 24 ? "24:00" : String(hour).padStart(2, "0") + ":00";
      tr.appendChild(th);

      for (let i = 0; i < 7; i++) {
        const date = new Date(currentWeekStart);
        date.setDate(date.getDate() + i);

        const dayData = getWeekDayData(date);
        const td = document.createElement("td");
        const input = document.createElement("input");

        input.type = "text";
        input.value = dayData.hours[String(hour)] || "";
        input.placeholder = "—";
        input.dataset.hour = String(hour);
        input.dataset.date = dateKey(date);

        td.appendChild(input);
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    wrap.appendChild(table);
    panel.appendChild(wrap);

    $("#weekGrid").parentElement.insertAdjacentElement("afterend", panel);
  }

  function renderRecords() {
    const list = $("#recordsList");
    list.innerHTML = "";

    if (!data.records.length) {
      const empty = document.createElement("div");
      empty.className = "empty-message";
      empty.textContent = "まだ記録がありません。テストが終わったら追加してみよう！";
      list.appendChild(empty);
      return;
    }

    const records = [...data.records].sort((a, b) =>
      (b.date || "").localeCompare(a.date || "")
    );

    records.forEach(record => {
      const item = document.createElement("article");
      item.className = "record-item";

      const top = document.createElement("div");
      top.className = "record-item-top";

      const title = document.createElement("strong");
      title.textContent =
        (record.date || "") + "　" +
        (record.name || "テスト") +
        (record.subject ? " / " + record.subject : "");

      const remove = document.createElement("button");
      remove.className = "delete-button";
      remove.textContent = "削除";
      remove.type = "button";
      remove.dataset.deleteRecord = record.id;

      top.appendChild(title);
      top.appendChild(remove);
      item.appendChild(top);

      if (record.score !== "" && record.score != null) {
        const score = document.createElement("p");
        score.textContent =
          "点数：" + record.score +
          (record.total ? " / " + record.total : "") +
          (record.goal !== "" && record.goal != null
            ? "　目標：" + record.goal + "点"
            : "");
        item.appendChild(score);
      }

      if (record.range) {
        const range = document.createElement("p");
        range.textContent = "テスト範囲：" + record.range;
        range.style.whiteSpace = "pre-wrap";
        item.appendChild(range);
      }

      if (record.reflection) {
        const reflection = document.createElement("p");
        reflection.textContent = "振り返り：" + record.reflection;
        item.appendChild(reflection);
      }

      list.appendChild(item);
    });
  }

  function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // バックアップの保存・復元
  $("#exportBackup").addEventListener("click", exportBackup);
  $("#importBackupButton").addEventListener("click", () => {
    $("#importBackupFile").click();
  });
  $("#importBackupFile").addEventListener("change", async event => {
    const file = event.target.files && event.target.files[0];
    await importBackup(file);
    // 同じファイルをもう一度選べるようにリセット
    event.target.value = "";
  });

  // ページ切り替え
  $$(".tab-button").forEach(button => {
    button.addEventListener("click", () => setPage(button.dataset.page));
  });

  // 月間ページ
  $("#prevMonth").addEventListener("click", () => {
    currentMonth = (currentMonth + 11) % 12;
    renderMonth();
  });

  $("#nextMonth").addEventListener("click", () => {
    currentMonth = (currentMonth + 1) % 12;
    renderMonth();
  });

  $("#monthSelect").addEventListener("change", event => {
    currentMonth = Number(event.target.value);
    renderMonth();
  });

  $("#calendar").addEventListener("input", event => {
    const target = event.target;
    if (!target.matches("[data-calendar-date]")) return;

    const date = parseDate(target.dataset.calendarDate);
    getDayData(date).note = target.value;
    saveData();
  });

  $("#monthPlan").addEventListener("input", event => {
    getMonth().plan = event.target.value;
    saveData();
  });

  $("#monthMemo").addEventListener("input", event => {
    getMonth().memo = event.target.value;
    saveData();
  });

  // 習慣名を変更すると、表示中の週に即時反映
  $$(".habit-inputs input").forEach(input => {
    input.addEventListener("input", event => {
      const index = Number(event.target.dataset.habitName);
      const month = getMonth(currentWeekStart.getMonth());
      month.habitNames[index] = event.target.value;

      $$("#weekGrid .week-day").forEach(dayColumn => {
        const labels = $$(".habit-item span", dayColumn);
        if (labels[index]) {
          labels[index].textContent =
            event.target.value || ("習慣" + (index + 1));
        }
      });

      saveData();
    });
  });

  // 週間ページの入力
  $("#weekGrid").addEventListener("input", event => {
    const target = event.target;
    if (!target.matches("[data-week-field]")) return;

    const date = parseDate(target.dataset.date);
    const day = getWeekDayData(date);
    day[target.dataset.weekField] = target.value;
    saveData();
  });

  $("#weekGrid").addEventListener("change", event => {
    const target = event.target;
    if (!target.matches("[data-habit-check]")) return;

    const date = parseDate(target.dataset.date);
    const day = getWeekDayData(date);
    day.habits[Number(target.dataset.habitCheck)] = target.checked;
    saveData();
  });

  $("#weekPage").addEventListener("input", event => {
    const target = event.target;
    if (!target.matches("[data-hour]")) return;

    const date = parseDate(target.dataset.date);
    const day = getWeekDayData(date);
    day.hours[target.dataset.hour] = target.value;
    saveData();
  });

  $("#weekPlan").addEventListener("input", event => {
    getWeekData(currentWeekStart).plan = event.target.value;
    saveData();
  });

  $("#weekReflection").addEventListener("input", event => {
    getWeekData(currentWeekStart).reflection = event.target.value;
    saveData();
  });

  $("#nextWeekGoal").addEventListener("input", event => {
    getWeekData(currentWeekStart).nextGoal = event.target.value;
    saveData();
  });

  $("#prevWeek").addEventListener("click", () => {
    currentWeekStart.setDate(currentWeekStart.getDate() - 7);
    currentWeekStart = getWeekStart(currentWeekStart);
    currentMonth = currentWeekStart.getMonth();
    renderWeek();
  });

  $("#nextWeek").addEventListener("click", () => {
    currentWeekStart.setDate(currentWeekStart.getDate() + 7);
    currentWeekStart = getWeekStart(currentWeekStart);
    currentMonth = currentWeekStart.getMonth();
    renderWeek();
  });

  // テスト記録
  $("#recordForm").addEventListener("submit", event => {
    event.preventDefault();

    data.records.push({
      id: createId(),
      date: $("#testDate").value,
      name: $("#testName").value.trim(),
      subject: $("#testSubject").value.trim(),
      score: $("#testScore").value,
      total: $("#testTotal").value,
      goal: $("#testGoal").value,
      range: $("#testRange").value.trim(),
      reflection: $("#testReflection").value.trim()
    });

    saveData();
    event.target.reset();
    $("#testDate").value = dateKey(new Date());
    renderRecords();
  });

  $("#recordsList").addEventListener("click", event => {
    const button = event.target.closest("[data-delete-record]");
    if (!button) return;

    const id = button.dataset.deleteRecord;
    data.records = data.records.filter(record => record.id !== id);
    saveData();
    renderRecords();
  });

  // 自由メモ
  $("#freeMemo").addEventListener("input", event => {
    data.freeMemo = event.target.value;
    saveData();
  });

  // 初期表示
  currentWeekStart = getWeekStart(new Date(YEAR, 0, 1));
  $("#testDate").value = dateKey(new Date());

  renderMonth();
  renderWeek();
  renderRecords();
  setPage("month");
})();
</script>
</body>
</html>
